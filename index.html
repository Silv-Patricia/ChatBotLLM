<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-fluid vh-100 overflow-hidden">
        <div class="row h-100">
            
            <aside id="sidebar" class="col-md-3 bg-light d-flex flex-column p-3 transition-layout">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2>ChatBot (Groq)</h2>
                    <button type="button" class="btn btn-outline-secondary btn-sm" onclick="toggleSidebar()">
                        <i class="bi bi-layout-sidebar"></i> Fechar
                    </button>
                </div>

                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="apiKeyInput" placeholder="Sua API Key">
                    <label for="apiKeyInput">Chave da API (Bearer)</label>
                </div>

                <button class="btn btn-success mb-3" onclick="novaConversa()">
                    <i class="bi bi-plus-circle"></i> Nova Conversa
                </button>

                <div class="flex-grow-1 overflow-auto">
                    <h6>Histórico de Conversas</h6>
                    <ul id="lista-conversas" class="list-group list-group-flush">
                    </ul>
                </div>
            </aside>

            <main id="main-content" class="col-md-9 d-flex flex-column h-100 bg-white transition-layout p-0">
                
                <div class="p-3 border-bottom d-flex align-items-center">
                    <button id="btn-open-sidebar" class="btn btn-outline-secondary d-none me-3" onclick="toggleSidebar()">
                        <i class="bi bi-list"></i> Menu
                    </button>
                    <h5 class="mb-0 m-auto">Conversa Atual</h5>
                </div>

                <div id="chat-history" class="flex-grow-1 p-4 overflow-auto d-flex flex-column gap-3">
                    <div class="text-center text-muted mt-5">Comece uma nova conversa!</div>
                </div>

                <div id="loading-indicator" class="text-center p-2 d-none">
                    <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                    <span class="ms-2 text-muted">A IA está digitando...</span>
                </div>

                <div class="p-3 bg-light border-top">
                    <div class="input-group">
                        <textarea class="form-control" id="userInput" placeholder="Peça ao ChatBot..." rows="2" style="resize: none;"></textarea>
                        <button class="btn btn-primary px-4" type="button" onclick="lidarComEnvio()">
                            <i class="bi bi-send-fill"></i>
                        </button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="modal fade" id="modalRenomear" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-bg-dark">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title">Renomear esta conversa</h5>
                </div>
                <div class="modal-body">
                    <input type="text" id="inputNovoNome" class="form-control bg-transparent text-white border-secondary">
                    <input type="hidden" id="idConversaRenomear">
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-link text-light text-decoration-none" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-secondary rounded-pill px-4" onclick="salvarNovoNome()">Renomear</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalExcluir" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-bg-dark">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title">Excluir conversa?</h5>
                </div>
                <div class="modal-body">
                    <p>Tem certeza de que deseja excluir esta conversa?</p>
                    <input type="hidden" id="idConversaExcluir">
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-link text-light text-decoration-none" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger rounded-pill px-4" onclick="confirmarExclusao()">Excluir</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
    
</body>
</html>
