<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="row">
        <aside class="col-3">
            <div id="cabecalho-menu">
                <h1>ChatBot</h1>
                <button type="button" class="btn btn-primary">Fechar Menu</button>
            </div>

            <div class="form-floating">
                <input type="password" class="form-control" id="floatingPassword" placeholder="Entre com sua chave">
                <label for="floatingPassword">Entre com sua chave</label>
            </div>

            <div>
                <h2>Conversas</h2>
            </div>
        </aside>

        <main class="col-3">
            <button type="button" class="btn btn-primary">Abrir Menu</button>
            <div>
                <div class="form-floating">
                    <textarea class="form-control" placeholder="Peça ao ChatBot" id="floatingTextarea"></textarea>
                    <label for="floatingTextarea">Peça ao ChatBot</label>
                </div>
                <button type="button" class="btn btn-primary" onclick="enviarMensagem(mensagem)">Enviar</button>
            </div>
        </main>

    </div>
</body>
<script src="script.js"></script>

</html>
